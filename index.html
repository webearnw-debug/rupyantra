<style>
.rh{position:sticky;top:0;z-index:50;background:#0B1230;color:#fff;font-family:"Outfit",system-ui,sans-serif;border-bottom:1px solid rgba(255,255,255,.08)}
.rh *{box-sizing:border-box}
.rh-in{max-width:1180px;margin:0 auto;padding:0 16px;height:64px;display:flex;align-items:center;gap:20px}
.rh-logo{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;margin-right:auto}
.rh-mark{width:36px;height:36px;border-radius:50%;border:2px solid #FFB300;display:grid;place-items:center;color:#FFB300;font-weight:800}
.rh-logo b{font-size:20px;line-height:1}
.rh-logo small{display:block;font-size:11px;color:#9AA3D6;margin-top:2px}
.rh nav{display:none;gap:6px}
.rh nav a,.rh-m a{color:#DDE2FF;text-decoration:none;font-size:15px;padding:8px 12px;border-radius:10px;position:relative}
.rh nav a:hover{background:rgba(255,255,255,.08)}
.rh nav a[aria-current="page"]{color:#FFB300;font-weight:600}
.rh-new{font-size:10px;font-weight:700;background:#7C3AED;color:#fff;padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:middle}
.rh-cta{display:none;background:#FFB300;color:#241800!important;font-weight:700;padding:10px 18px!important;border-radius:12px!important}
.rh-btn{width:42px;height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:none;color:#fff;font-size:22px;cursor:pointer}
.rh-m{display:none;flex-direction:column;padding:8px 16px 16px;border-top:1px solid rgba(255,255,255,.08)}
.rh-m.open{display:flex}
.rh-m a{font-size:17px;padding:14px 8px;border-bottom:1px solid rgba(255,255,255,.08)}
.rh-m a.ai{margin-top:10px;background:#FFB300;color:#241800;font-weight:700;border-radius:12px;border:0;text-align:center}
@media (min-width:900px){.rh nav{display:flex}.rh-cta{display:inline-block}.rh-btn,.rh-m{display:none!important}}
</style>

<header class="rh">
  <div class="rh-in">
    <a class="rh-logo" href="/" aria-label="Rupeyantra home">
      <span class="rh-mark" aria-hidden="true">₹</span>
      <span><b>Rupeyantra</b><small>Smart Finance Tools</small></span>
    </a>
    <nav aria-label="Main menu">
      <a href="/">Home</a>
      <a href="/calculators">Calculators</a>
      <a href="/compare">Compare</a>
      <a href="/market-data">Market Data</a>
      <a href="/ai">AI Assistant<span class="rh-new">NEW</span></a>
    </nav>
    <a class="rh-cta" href="/calculators" style="text-decoration:none;font-size:15px">Start Calculating</a>
    <button class="rh-btn" id="rhBtn" aria-label="Menu kholo" aria-expanded="false">☰</button>
  </div>
  <nav class="rh-m" id="rhM" aria-label="Mobile menu">
    <a href="/">Home</a>
    <a href="/calculators">Calculators</a>
    <a href="/compare">Compare</a>
    <a href="/market-data">Market Data</a>
    <a class="ai" href="/ai">✨ AI Assistant</a>
  </nav>
</header>
<script>
(function(){
  var b=document.getElementById('rhBtn'),m=document.getElementById('rhM');
  b.onclick=function(){var o=m.classList.toggle('open');b.setAttribute('aria-expanded',o);b.textContent=o?'✕':'☰'};
  document.querySelectorAll('.rh nav a').forEach(function(a){
    if(a.getAttribute('href')===location.pathname)a.setAttribute('aria-current','page');
  });
})();
</script>
