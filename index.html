<style>
:root{--text:#1b1b2f;--muted:#6f6c85;--line:#e3ddf3;--card:#fff;--bot:#fff;
--g1:#0E9AA7;--g2:#3B5BDB;--g3:#7C3AED;
--sky:linear-gradient(180deg,#B7EAEA 0%,#D9CCFF 16%,#F5F0FF 34%,#fff 58%);
--bg:#fff}
@media (prefers-color-scheme:dark){:root{--text:#EEEAFB;--muted:#A19DBB;--line:#34304F;--card:#1B1930;--bot:#1B1930;--sky:linear-gradient(180deg,#14434C 0%,#2A2158 20%,#17142B 45%,#100F1E 70%);--bg:#100F1E}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#F0F1EA;min-height:100%;font-family:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

/* ===== HEADER ===== */
header{background:#FFFFFF;border-bottom:1px solid #E1E5EB;padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:1100px;margin:0 auto;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand .name{font-family:'Fraunces',serif;font-weight:600;font-size:1.3rem;color:#16261F;letter-spacing:-0.01em}
.brand .name span{color:#1F5C43}
.ai-btn{display:inline-flex;align-items:center;gap:8px;background:#1F5C43;color:#FFFFFF;text-decoration:none;font-family:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:600;font-size:.95rem;padding:10px 16px;border-radius:999px;white-space:nowrap;transition:background .15s ease,transform .15s ease}
.ai-btn:hover{background:#174a36}
.ai-btn:active{transform:scale(.97)}
.ai-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.brand:focus-visible,.ai-btn:focus-visible{outline:3px solid #97551C;outline-offset:3px;border-radius:12px}
.ai-btn:focus-visible{border-radius:999px}
@media (max-width:380px){.brand .name{font-size:1.15rem}.ai-btn{padding:9px 13px;font-size:.9rem}}

/* ===== AI (header ke button se khulta hai) ===== */
#app{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;background:var(--sky),var(--bg);color:var(--text);padding-top:env(safe-area-inset-top,0px)}
#app.open{display:flex}
.top{display:flex;justify-content:space-between;align-items:center;padding:6px 12px}
.ib{width:40px;height:40px;border:0;background:none;color:var(--text);display:grid;place-items:center;border-radius:14px;cursor:pointer}
.ib:hover{background:rgba(120,100,200,.12)}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--g3);outline-offset:2px}

#body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:640px;margin:0 auto;padding:0 16px}
h1{font-size:clamp(22px,6vw,30px);line-height:1.2;font-weight:600;text-align:center;margin:0 0 20px;letter-spacing:-.01em;
  background:linear-gradient(100deg,var(--g1),var(--g2) 55%,var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
#msgs{display:none;flex:1;min-height:0;overflow:auto;padding:8px 0 14px;flex-direction:column;gap:12px}
.msg{max-width:86%;padding:9px 14px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.5}
.msg.bot{background:var(--bot);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:6px}
.msg.user{background:linear-gradient(100deg,var(--g2),var(--g3));color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.msg.user img{display:block;max-width:100%;max-height:200px;border-radius:12px;margin:2px 0 6px}
.msg.user .fl{font-size:13px;opacity:.95;margin-bottom:4px;overflow-wrap:anywhere}
.msg.err{border-color:#e5484d;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}

.card{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:12px 12px 8px 16px;min-height:112px;display:flex;flex-direction:column;box-shadow:0 8px 30px -14px rgba(90,70,200,.25)}
textarea:focus,textarea:focus-visible{outline:none;box-shadow:none}
textarea{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--text);font:400 15px/1.5 "Outfit",system-ui,sans-serif;min-height:48px;max-height:200px;padding:0}
textarea::placeholder{color:var(--muted)}
.row{display:flex;justify-content:flex-end;align-items:center;gap:4px;padding-top:6px}
.circle{width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;flex:none}
.circle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#mic{background:none;color:var(--text)}
#mic.on{background:rgba(124,58,237,.15);color:var(--g3)}
#send{background:linear-gradient(100deg,var(--g2),var(--g3));color:#fff;display:none}
#send:disabled{opacity:.5}
#plusWrap{position:relative;margin-right:auto}
#plus{background:none;color:var(--text)}
#plus:hover,#plus.on{background:rgba(124,58,237,.12)}
.has-text #send{display:grid}.has-text #mic{display:none}

.menu{display:none;position:absolute;left:0;bottom:calc(100% + 8px);min-width:150px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 10px 30px -10px rgba(60,40,140,.35);z-index:10}
.menu.open{display:block}
.menu button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--text);font:500 15px "Outfit",system-ui,sans-serif;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left}
.menu button:hover{background:rgba(124,58,237,.1)}
.menu svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
input[type=file]{display:none}

.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 0 8px}
.chips:empty{display:none}
.chip{display:flex;align-items:center;gap:6px;max-width:100%;background:rgba(124,58,237,.1);border:1px solid var(--line);border-radius:12px;padding:4px 6px 4px 4px;font-size:13px}
.chip img{width:36px;height:36px;object-fit:cover;border-radius:8px;display:block}
.chip .ic{width:36px;height:36px;display:grid;place-items:center;font-size:18px}
.chip .nm{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;width:24px;height:24px;border-radius:50%;cursor:pointer}
.note{font-size:13px;color:#e5484d;padding:0 6px 8px;display:none}
.note.show{display:block}

.chatting #body{justify-content:flex-start}
.chatting h1{display:none}
.chatting #msgs{display:flex}
.chatting .card{min-height:0;margin-bottom:calc(10px + env(safe-area-inset-bottom,0px));flex-direction:row;flex-wrap:wrap;align-items:flex-end;padding:6px 6px 6px 6px;gap:4px}
.chatting .chips{order:-1;flex-basis:100%;padding:4px 6px 4px}
.chatting .row{display:contents}
.chatting #plusWrap{order:0;margin-right:0}
.chatting textarea{order:1;flex:1;min-width:0;min-height:24px;padding:8px 0}
.chatting #mic{order:2}
.chatting #send{order:3}
.sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 18px}
.sugg button{border:1px solid var(--line);background:var(--card);color:var(--text);font:500 13.5px "Outfit",system-ui,sans-serif;padding:8px 14px;border-radius:999px;cursor:pointer;text-align:left;line-height:1.3}
.sugg button:hover{background:rgba(124,58,237,.1)}
.chatting .sugg{display:none}
.tools{display:flex;gap:4px;margin-top:6px}
.tools button{border:0;background:none;color:var(--muted);font:500 12.5px "Outfit",system-ui,sans-serif;cursor:pointer;padding:3px 8px;border-radius:8px}
.tools button:hover{background:rgba(124,58,237,.1);color:var(--text)}
.thinking{background:none!important;border:0!important;padding:4px 0!important;display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.thinking .dot{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g3));color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700;animation:pulse 1.4s ease-in-out infinite}
.thinking .t{background:linear-gradient(100deg,var(--g3),var(--g1),var(--g2),var(--g3));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 2.2s linear infinite}
@keyframes shine{to{background-position:-300% 0}}
@keyframes pulse{50%{transform:scale(.85);opacity:.7}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.ai-btn{transition:none}.thinking .dot,.thinking .t{animation:none}}
</style>
</head>

  <div class="wrap">
    <a href="/" class="brand" aria-label="Rupyantra home">
      <svg viewBox="0 0 48 48" width="32" height="32" aria-hidden="true">
        <circle cx="24" cy="24" r="21" fill="none" stroke="#97551C" stroke-width="1.5"/>

        <path d="M15 33L33 15m0 0h-7.5m7.5 0v7.5" stroke="#1F5C43" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <main id="body">

<script>
const $=id=>document.getElementById(id);
const app=$('app'),msgs=$('msgs'),inp=$('inp'),send=$('send'),form=$('form'),mic=$('mic');
const plus=$('plus'),menu=$('menu'),imgIn=$('imgIn'),fileIn=$('fileIn'),chips=$('chips'),note=$('note');
let history=[],pending=[],log=[],gen=0;
const MAX_FILES=3,MAX_B64=3800000,MAX_PDF=2500000,MAX_TEXT=12000;
const KEY='rupeyantra_chat_v1';
const SUGG=[
  'EMI kaise nikalte hain?',
  '50 lakh ka home loan 8.5% par 20 saal ke liye EMI kitni hogi?',
  'Mahine ki 5000 ki SIP 12% par 10 saal mein kitni banegi?',
  'Mahine ka budget kaise banaye?'
];

function refresh(){form.classList.toggle('has-text',inp.value.trim().length>0||pending.length>0)}
function grow(){inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,200)+'px';refresh()}
inp.addEventListener('input',grow);
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});

/* chat save / restore (sirf is phone ke browser mein) */
function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify({
      log:log.slice(-30),
      history:history.slice(-20).map(m=>({role:m.role,content:m.content.slice(0,4000)}))
    }));
  }catch(e){}
}
function wipe(){try{localStorage.removeItem(KEY)}catch(e){}}

function add(role,text){const d=document.createElement('div');d.className='msg '+role;d.textContent=text;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d}
function addUser(text,atts){
  const d=document.createElement('div');d.className='msg user';
  atts.forEach(a=>{
    if(a.thumb){const im=document.createElement('img');im.src=a.thumb;im.alt=a.name;d.appendChild(im)}
    else{const s=document.createElement('div');s.className='fl';s.textContent='📎 '+a.name;d.appendChild(s)}
  });
  if(text){const t=document.createElement('div');t.textContent=text;d.appendChild(t)}
  msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;
}
function showError(bot,text){bot.classList.remove('thinking');bot.classList.add('err');bot.textContent=text}

/* copy / share */
async function copyText(t,btn){
  let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true}
  catch(e){
    const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{ok=document.execCommand('copy')}catch(_){}
    ta.remove();
  }
  btn.textContent=ok?'Copy ho gaya ✓':'Copy nahi hua';
  setTimeout(()=>{btn.textContent='Copy'},1800);
}

/* bot ka jawab: dheere-dheere likha hua + Copy/Share button */
function botMsg(bot,text,animate){
  bot.classList.remove('thinking','err');bot.innerHTML='';
  const span=document.createElement('span');bot.appendChild(span);
  const tools=document.createElement('div');tools.className='tools';
  const cb=document.createElement('button');cb.type='button';cb.textContent='Copy';
  cb.onclick=()=>copyText(text,cb);tools.appendChild(cb);
  if(navigator.share){
    const sb=document.createElement('button');sb.type='button';sb.textContent='Share';
    sb.onclick=()=>{navigator.share({text:text+'\n\n- Rupeyantra AI'}).catch(()=>{})};
    tools.appendChild(sb);
  }
  const finish=()=>{span.textContent=text;bot.appendChild(tools);msgs.scrollTop=msgs.scrollHeight};
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(!animate||reduce||text.length<40){finish();return}
  const my=gen;let i=0;const step=Math.max(3,Math.ceil(text.length/90));
  const t=setInterval(()=>{
    if(my!==gen){clearInterval(t);return}
    i+=step;
    if(i>=text.length){clearInterval(t);finish();return}
    span.textContent=text.slice(0,i);msgs.scrollTop=msgs.scrollHeight;
  },18);
}

let noteTimer=null;
function warn(t){note.textContent=t;note.classList.add('show');clearTimeout(noteTimer);noteTimer=setTimeout(()=>note.classList.remove('show'),5000)}

/* + menu */
function closeMenu(){menu.classList.remove('open');plus.classList.remove('on');plus.setAttribute('aria-expanded','false')}
plus.onclick=e=>{e.stopPropagation();const o=menu.classList.toggle('open');plus.classList.toggle('on',o);plus.setAttribute('aria-expanded',o)};
document.addEventListener('click',e=>{if(!menu.contains(e.target))closeMenu()});
$('pickPhoto').onclick=()=>{closeMenu();imgIn.click()};
$('pickFile').onclick=()=>{closeMenu();fileIn.click()};

/* attachments */
function readDataURL(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(new Error('File padh nahi payi'));r.readAsDataURL(f)})}
function readText(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(new Error('File padh nahi payi'));r.readAsText(f)})}

async function compressImage(file){
  const url=await readDataURL(file);
  const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('Ye photo khul nahi payi'));i.src=url});
  const s=Math.min(1,1280/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
  const out=c.toDataURL('image/jpeg',.82);
  return{kind:'media',mime:'image/jpeg',data:out.split(',')[1],thumb:out,name:file.name||'photo'};
}

async function makeAttachment(file){
  const name=file.name||'file',ext=(name.split('.').pop()||'').toLowerCase();
  if(file.type.startsWith('image/'))return compressImage(file);
  if(file.type==='application/pdf'||ext==='pdf'){
    if(file.size>MAX_PDF)throw new Error('PDF badi hai (2.5 MB tak chalti hai)');
    const d=await readDataURL(file);
    return{kind:'media',mime:'application/pdf',data:d.split(',')[1],name};
  }
  if(file.type.startsWith('text/')||['txt','csv','tsv','json','md','log'].includes(ext)){
    let t=await readText(file);
    if(t.length>MAX_TEXT)t=t.slice(0,MAX_TEXT)+'\n...(file ka baaki hissa kaat diya gaya)';
    return{kind:'text',name,text:t};
  }
  throw new Error('Ye file type abhi nahi chalta. PDF, TXT, CSV, JSON, MD bhejo.');
}

function totalB64(extra){return pending.concat(extra?[extra]:[]).reduce((n,a)=>n+(a.data?a.data.length:0),0)}

function renderChips(){
  chips.innerHTML='';
  pending.forEach((a,i)=>{
    const c=document.createElement('div');c.className='chip';
    if(a.thumb){const im=document.createElement('img');im.src=a.thumb;im.alt='';c.appendChild(im)}
    else{const ic=document.createElement('span');ic.className='ic';ic.textContent='📄';c.appendChild(ic)}
    const nm=document.createElement('span');nm.className='nm';nm.textContent=a.name;c.appendChild(nm);
    const x=document.createElement('button');x.type='button';x.textContent='×';x.setAttribute('aria-label','Hatao');
    x.onclick=()=>{pending.splice(i,1);renderChips();refresh()};
    c.appendChild(x);chips.appendChild(c);
  });
  refresh();
}

async function onPick(input){
  const files=Array.from(input.files||[]);input.value='';
  for(const f of files){
    if(pending.length>=MAX_FILES){warn('Ek baar mein sirf '+MAX_FILES+' photo/file jod sakte ho');break}
    try{
      const a=await makeAttachment(f);
      if(a.data&&totalB64(a)>MAX_B64){warn('Photo/file ka size bahut zyada hai, chhoti bhejo');continue}
      pending.push(a);renderChips();
    }catch(e){warn(e.message)}
  }
}
imgIn.addEventListener('change',()=>onPick(imgIn));
fileIn.addEventListener('change',()=>onPick(fileIn));

/* chat */
function buildPayload(){
  let last=-1;history.forEach((m,i)=>{if(m.attachments)last=i});
  return history.map((m,i)=>i===last?m:{role:m.role,content:m.content});
}

async function ask(q){
  if((!q&&!pending.length)||send.disabled)return;
  app.classList.add('chatting');
  const atts=pending.slice();pending=[];renderChips();
  let content=q;
  if(!content)content=atts.some(a=>a.thumb)?'Is photo ko dekho aur batao isme kya hai.':'Is file ko padho aur batao isme kya hai.';
  atts.filter(a=>a.kind==='text').forEach(a=>{content+='\n\n[File: '+a.name+']\n'+a.text});
  const media=atts.filter(a=>a.kind==='media').map(a=>({mime:a.mime,data:a.data}));
  inp.value='';grow();inp.style.height='auto';
  addUser(q,atts);
  log.push({role:'user',text:q,files:atts.map(a=>a.name)});
  const m={role:'user',content};if(media.length)m.attachments=media;
  history.push(m);
  send.disabled=true;const bot=add('bot','');
  bot.classList.add('thinking');bot.innerHTML='<span class="dot">₹</span><span class="t">Soch raha hu...</span>';
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:buildPayload()})});
    let data=null;
    try{data=await res.json()}catch(_){}
    if(!res.ok||!data||!data.reply){
      let t='Error '+res.status+'\n\n';
      if(data&&data.message)t+=data.message;
      else if(res.status===413)t+='Photo/file bahut badi hai. Chhoti photo ya file bhejo.';
      else if(res.status===404)t+='/api/chat nahi mila. Check karo ki file api/chat.js naam se, api folder ke andar hai.';
      else t+='Server se sahi jawab nahi aaya.';
      if(data&&data.keys)t+='\n\nKeys: '+Object.keys(data.keys).map(k=>k+'='+(data.keys[k]?'mili':'NAHI mili')).join(', ');
      showError(bot,t);history.pop();log.pop();
    }else{
      botMsg(bot,data.reply,true);
      history.push({role:'assistant',content:data.reply});
      log.push({role:'bot',text:data.reply});
      save();
    }
  }catch(e){
    showError(bot,'Network error: '+e.message+'\n\nInternet check karo aur dobara try karo.');history.pop();log.pop();
  }finally{send.disabled=false;msgs.scrollTop=msgs.scrollHeight}
}
form.addEventListener('submit',e=>{e.preventDefault();ask(inp.value.trim())});

$('newChat').onclick=()=>{gen++;history=[];pending=[];log=[];wipe();renderChips();msgs.innerHTML='';app.classList.remove('chatting');inp.value='';grow();inp.focus()};

/* shuru ke sawal ke buttons */
SUGG.forEach(t=>{
  const b=document.createElement('button');b.type='button';b.textContent=t;
  b.onclick=()=>ask(t);$('sugg').appendChild(b);
});

/* pichli chat wapas dikhao */
(function restore(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY)||'null');
    if(!d||!Array.isArray(d.log)||!d.log.length)return;
    log=d.log;history=Array.isArray(d.history)?d.history:[];
    app.classList.add('chatting');
    log.forEach(x=>{
      if(x.role==='user')addUser(x.text||'',(x.files||[]).map(n=>({name:n})));
      else botMsg(add('bot',''),x.text||'',false);
    });
  }catch(e){}
})();

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){mic.style.display='none'}else{
  let rec=null,on=false;
  mic.onclick=()=>{
    if(on){rec&&rec.stop();return}
    rec=new SR();rec.lang='hi-IN';rec.interimResults=true;
    rec.onresult=e=>{inp.value=Array.from(e.results).map(r=>r[0].transcript).join('');grow()};
    rec.onend=()=>{on=false;mic.classList.remove('on')};
    rec.onerror=()=>{on=false;mic.classList.remove('on')};
    on=true;mic.classList.add('on');rec.start();
  };
}

/* ===== Header ka button: AI kholo / band karo ===== */
function openAI(push){
  app.classList.add('open');
  document.documentElement.style.overflow='hidden';
  if(push){try{window.history.pushState({ai:1},'','/ai')}catch(e){}}
}
function closeAI(){
  app.classList.remove('open');
  document.documentElement.style.overflow='';
}
$('openAI').addEventListener('click',e=>{e.preventDefault();openAI(true)});
$('back').onclick=()=>{
  if(window.history.state&&window.history.state.ai){window.history.back()}
  else{closeAI();try{window.history.replaceState(null,'','/')}catch(e){}}
};
window.addEventListener('popstate',()=>{if(location.pathname==='/ai')openAI(false);else closeAI()});
if(location.pathname==='/ai')openAI(false);
