<style>
:root{--text:#1b1b2f;--muted:#6f6c85;--line:#e3ddf3;--card:#fff;--bot:#fff;
--g1:#0E9AA7;--g2:#3B5BDB;--g3:#7C3AED;
--sky:linear-gradient(180deg,#B7EAEA 0%,#D9CCFF 16%,#F5F0FF 34%,#fff 58%);
--bg:#fff}
@media (prefers-color-scheme:dark){:root{--text:#EEEAFB;--muted:#A19DBB;--line:#34304F;--card:#1B1930;--bot:#1B1930;--sky:linear-gradient(180deg,#14434C 0%,#2A2158 20%,#17142B 45%,#100F1E 70%);--bg:#100F1E}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{height:100%;display:flex;flex-direction:column;background:var(--sky);padding-top:env(safe-area-inset-top,0px)}
.top{display:flex;justify-content:space-between;align-items:center;padding:6px 12px}
.ib{width:40px;height:40px;border:0;background:none;color:var(--text);display:grid;place-items:center;border-radius:14px;cursor:pointer;text-decoration:none}
.ib:hover{background:rgba(120,100,200,.12)}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--g3);outline-offset:2px}

#body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:640px;margin:0 auto;padding:0 16px}
h1{font-size:clamp(22px,6vw,30px);line-height:1.2;font-weight:600;text-align:center;margin:0 0 20px;letter-spacing:-.01em;
  background:linear-gradient(100deg,var(--g1),var(--g2) 55%,var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
#msgs{display:none;flex:1;min-height:0;overflow:auto;padding:8px 0 14px;flex-direction:column;gap:12px}
.msg{max-width:86%;padding:9px 14px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.5}
.msg.bot{background:var(--bot);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:6px}
.msg.user{background:linear-gradient(100deg,var(--g2),var(--g3));color:#fff;align-self:flex-end;border-bottom-right-radius:6px}

.card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:12px 12px 8px 16px;min-height:112px;display:flex;flex-direction:column;box-shadow:0 8px 30px -14px rgba(90,70,200,.25)}
.card:focus-within{border-color:var(--line)}
textarea:focus,textarea:focus-visible{outline:none;box-shadow:none}
textarea{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--text);font:400 15px/1.5 "Outfit",system-ui,sans-serif;min-height:48px;max-height:200px;padding:0}
textarea::placeholder{color:var(--muted)}
.row{display:flex;justify-content:flex-end;align-items:center;gap:4px;padding-top:6px}
.circle{width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer}
.circle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#mic{background:none;color:var(--text)}
#mic.on{background:rgba(124,58,237,.15);color:var(--g3)}
#send{background:linear-gradient(100deg,var(--g2),var(--g3));color:#fff;display:none}
#send:disabled{opacity:.5}
.has-text #send{display:grid}.has-text #mic{display:none}

.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--text);padding:7px 13px;border-radius:99px;font:500 13px "Outfit",system-ui,sans-serif;cursor:pointer}
.chip:hover{border-color:var(--g3)}
.note{text-align:center;color:var(--muted);font-size:12px;margin:10px 0 0}

/* chat shuru hone ke baad */
.chatting #body{justify-content:flex-start}
.chatting h1,.chatting .chips,.chatting .note{display:none}
.chatting #msgs{display:flex}
.chatting .card{min-height:0;border-radius:22px;margin-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.chatting textarea{min-height:24px}
.chatting .row{padding-top:0}
.chatting .card{flex-direction:row;align-items:flex-end;padding:6px 6px 6px 16px;gap:6px}
.chatting textarea{padding:8px 0}
.chatting .row{padding:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div id="app">
  <div class="top">
    <a class="ib" href="/" aria-label="Home">
      <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>
    </a>
    <button class="ib" id="newChat" aria-label="Naya chat">
      <svg viewBox="0 0 24 24"><path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/><path d="M18.4 3.6a1.9 1.9 0 0 1 2.7 2.7L12 15.4l-3.8 1 1-3.8z"/></svg>
    </button>
  </div>

  <main id="body">
    <h1>Rupeyantra AI se poochho apna paise ka sawal</h1>
    <div id="msgs" aria-live="polite"></div>

    <div id="dock">
      <form class="card" id="form">
        <textarea id="inp" rows="1" placeholder="Aapka agla sawal kya hai?" aria-label="Apna sawal"></textarea>
        <div class="row">
          <button type="button" class="circle" id="mic" aria-label="Bolkar poochho">
            <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg>
          </button>
          <button type="submit" class="circle" id="send" aria-label="Bhejo">
            <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </form>
      <div class="chips" id="chips"></div>
      <p class="note">AI sirf jaankari deta hai, financial salah nahi.</p>
    </div>
  </main>
</div>

<script>
const $=id=>document.getElementById(id);
const app=$('app'),msgs=$('msgs'),inp=$('inp'),send=$('send'),form=$('form'),mic=$('mic'),chips=$('chips');
let history=[];

['EMI kaise nikalte hain?','SIP kya hota hai?','Budget kaise banaye?','Home loan lun ya nahi?'].forEach(q=>{
  const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=q;b.onclick=()=>ask(q);chips.appendChild(b)});

function add(role,text){const d=document.createElement('div');d.className='msg '+role;d.textContent=text;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d}
function grow(){inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,200)+'px';form.classList.toggle('has-text',inp.value.trim().length>0)}
inp.addEventListener('input',grow);
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});

async function ask(q){
  if(!q||send.disabled)return;
  app.classList.add('chatting');
  inp.value='';grow();inp.style.height='auto';
  add('user',q);history.push({role:'user',content:q});
  send.disabled=true;const bot=add('bot','...');
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});
    if(!res.ok)throw new Error(res.status);
    const data=await res.json();
    bot.textContent=data.reply;history.push({role:'assistant',content:data.reply});
  }catch(e){
    bot.textContent='Kuch gadbad ho gayi, thodi der baad dobara try karo.';history.pop();
  }finally{send.disabled=false;msgs.scrollTop=msgs.scrollHeight}
}
form.addEventListener('submit',e=>{e.preventDefault();ask(inp.value.trim())});

$('newChat').onclick=()=>{history=[];msgs.innerHTML='';app.classList.remove('chatting');inp.value='';grow();inp.focus()};

/* bolkar poochho (Hindi/English), jahan browser support kare */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){mic.style.display='none'}else{
  let rec=null,on=false;
  mic.onclick=()=>{
    if(on){rec&&rec.stop();return}
    rec=new SR();rec.lang='hi-IN';rec.interimResults=true;
    rec.onresult=e=>{inp.value=Array.from(e.results).map(r=>r[0].transcript).join('');grow()};
    rec.onend=()=>{on=false;mic.classList.remove('on')};
    rec.onerror=()=>{on=false;mic.classList.remove('on')};
    on=true;mic.classList.add('on');rec.start();
  };
}
</script>
</body>
