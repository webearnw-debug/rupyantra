        type="button"
        aria-label="Open navigation menu"

        <span></span>

        <span></span>

      </button>

  </div>


  <!-- MOBILE NAV -->
  <nav class="ry-mobile-nav" aria-label="Mobile navigation">

      <span>⌂</span>

      <span>▣</span>
      Calculators
    </a>

    <a href="/ai">
      <span>✦</span>
      Rupeyantra AI
      <b>NEW</b>
    </a>

    <a href="/finance">

      Finance

    <a href="/guides">

<style>

/* =========================
   RESET
   ========================= */

.ry-header,
.ry-header * {
  box-sizing: border-box;
}


/* =========================
   HEADER
   ========================= */

.ry-header {
  position: sticky;
  top: 0;
  z-index: 9999;

  width: 100%;

  background: rgba(255,255,255,.92);

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  border-bottom: 1px solid rgba(15,23,42,.08);

  box-shadow:
    0 4px 25px rgba(15,23,42,.045);
}


.ry-header-inner {

  max-width: 1280px;

  min-height: 76px;

  margin: auto;

  padding:
    0 24px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 30px;
}


/* =========================
   BRAND
   ========================= */

.ry-brand {

  display: inline-flex;

  align-items: center;

  gap: 11px;

  text-decoration: none;

  flex-shrink: 0;
}


.ry-logo {

  width: 43px;
  height: 43px;

  display: grid;
  place-items: center;

  border-radius: 13px;

  color: white;

  font-size: 22px;

  font-weight: 900;

  background:
    linear-gradient(
      135deg,
      #111827,
      #2563eb
    );

  box-shadow:
    0 8px 22px rgba(37,99,235,.24);

  position: relative;

  overflow: hidden;
}


.ry-logo::after {

  content: "";

  position: absolute;

  width: 18px;
  height: 70px;

  background: rgba(255,255,255,.18);

  transform: rotate(30deg);

  left: -30px;

  transition: .5s;
}


.ry-brand:hover .ry-logo::after {
  left: 60px;
}


.ry-brand-info {

  display: flex;

  flex-direction: column;

  line-height: 1;
}


.ry-brand-info strong {

  color: #0f172a;

  font-size: 21px;

  font-weight: 850;

  letter-spacing: -.6px;
}


.ry-brand-info small {

  margin-top: 5px;

  color: #64748b;

  font-size: 10px;

  font-weight: 650;

  letter-spacing: .5px;

  text-transform: uppercase;
}


/* =========================
   NAVIGATION
   ========================= */

.ry-nav {

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 3px;

  margin-left: auto;
}


.ry-nav-link {

  position: relative;

  display: inline-flex;

  align-items: center;

  gap: 7px;

  padding: 11px 13px;

  border-radius: 10px;

  color: #475569;

  text-decoration: none;

  font-size: 14px;

  font-weight: 650;

  transition:
    color .2s ease,
    background .2s ease,
    transform .2s ease;
}


.ry-nav-link:hover {

  color: #1d4ed8;

  background: #eff6ff;

  transform: translateY(-1px);
}


.ry-nav-link.active {

  color: #1d4ed8;

  background: #eff6ff;
}


/* Active underline */

.ry-nav-link.active::after {

  content: "";

  position: absolute;

  left: 14px;
  right: 14px;

  bottom: 3px;

  height: 2px;

  border-radius: 5px;

  background: #2563eb;
}


/* Calculator */

.calculator-link {

  color: #1e40af;
}


.nav-icon {

  font-size: 15px;
}


/* AI */

.ai-link {

  color: #4f46e5;
}


.ai-dot {

  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: #7c3aed;

  box-shadow:
    0 0 0 4px rgba(124,58,237,.10);
}


.ai-link b,
.ry-mobile-nav b {

  padding: 3px 6px;

  border-radius: 5px;

  color: #6d28d9;

  background: #f3e8ff;

  font-size: 8px;

  font-weight: 800;

  letter-spacing: .4px;
}


/* =========================
   RIGHT ACTION
   ========================= */

.ry-actions {

  display: flex;

  align-items: center;

  gap: 10px;
}


.ry-primary-btn {

  display: inline-flex;

  align-items: center;

  gap: 10px;

  padding: 12px 17px;

  border-radius: 11px;

  background:
    linear-gradient(
      135deg,
      #2563eb,
      #1d4ed8
    );

  color: white;

  text-decoration: none;

  font-size: 13px;

  font-weight: 750;

  box-shadow:
    0 8px 22px rgba(37,99,235,.22);

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}


.ry-primary-btn:hover {

  transform: translateY(-2px);

  box-shadow:
    0 12px 28px rgba(37,99,235,.30);
}


.arrow {

  font-size: 17px;

  transition: transform .2s;
}


.ry-primary-btn:hover .arrow {

  transform: translateX(3px);
}


/* =========================
   MOBILE BUTTON
   ========================= */

.ry-menu-btn {

  display: none;

  width: 43px;
  height: 43px;

  border: 1px solid #e2e8f0;

  border-radius: 11px;

  background: white;

  cursor: pointer;

  padding: 9px;
}


.ry-menu-btn span {

  display: block;

  width: 21px;

  height: 2px;

  margin: 4px auto;

  border-radius: 5px;

  background: #0f172a;

  transition: .25s;
}


/* =========================
   MOBILE NAV
   ========================= */

.ry-mobile-nav {

  display: none;
}


/* =========================
   TABLET
   ========================= */

@media (max-width: 1050px) {

  .ry-nav {

    gap: 0;
  }

  .ry-nav-link {

    padding-left: 9px;
    padding-right: 9px;

    font-size: 13px;
  }

  .ry-primary-btn {

    padding-left: 13px;
    padding-right: 13px;
  }
}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 800px) {

  .ry-header-inner {

    min-height: 66px;

    padding: 0 15px;
  }


  .ry-nav,
  .ry-primary-btn {

    display: none;
  }


  .ry-menu-btn {

    display: block;
  }


  .ry-brand-info strong {

    font-size: 19px;
  }


  .ry-brand-info small {

    font-size: 8px;
  }


  .ry-logo {

    width: 39px;
    height: 39px;

    border-radius: 11px;
  }


  /* MOBILE DROPDOWN */

  .ry-mobile-nav {

    position: absolute;

    top: 66px;

    left: 10px;
    right: 10px;

    padding: 10px;

    display: none;

    flex-direction: column;

    gap: 4px;

    background: rgba(255,255,255,.98);

    border: 1px solid #e5e7eb;

    border-radius: 16px;

    box-shadow:
      0 20px 50px rgba(15,23,42,.14);
  }


  .ry-mobile-nav.open {

    display: flex;
  }


  .ry-mobile-nav a {

    display: flex;

    align-items: center;

    gap: 11px;

    padding: 13px;

    border-radius: 10px;

    color: #334155;

    text-decoration: none;

    font-size: 14px;

    font-weight: 650;
  }


  .ry-mobile-nav a:hover {

    background: #eff6ff;

    color: #2563eb;
  }


  .ry-mobile-nav .mobile-cta {

    justify-content: center;

    margin-top: 5px;

    color: white;

    background: #2563eb;

    font-weight: 750;
  }
}


/* =========================
   SMALL MOBILE
   ========================= */

@media (max-width: 390px) {

  .ry-brand-info small {

    display: none;
  }

  .ry-brand-info strong {

    font-size: 18px;
  }
}

</style>


<script>

function ryToggleMenu() {

  const menu =
    document.querySelector(".ry-mobile-nav");

  const button =
    document.querySelector(".ry-menu-btn");

  menu.classList.toggle("open");

  button.setAttribute(
    "aria-expanded",
    menu.classList.contains("open")
  );
}

</script>
